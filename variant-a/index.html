<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gut Run</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="viewport">
      <main id="stage">
        <canvas id="game" class="layer"></canvas>
        <img class="layer" src="assets/logo.png" alt="Your Logo" />
        <img class="layer" src="assets/01_game/tut.png" alt="Bringe Poo durch den Darm ans Ziel." />
        <img id="gesture" src="assets/gesture.png" alt="Tap to run" />

        <section id="fail-card" class="layer endcard" hidden>
          <img class="layer" src="assets/02_endcard/fail/bubble.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac1.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac2.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac3.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac4.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/bac5.png" alt="" />
          <img class="layer" src="assets/02_endcard/fail/sad.png" alt="" />
          <img
            class="layer"
            src="assets/02_endcard/fail/hl.png"
            alt="Poo, das tat weh! Erfahre jetzt, was deinem Darm guttut."
          />
          <button id="fail-cta" class="endcard-button" type="button">
            <img src="assets/02_endcard/fail/cta.png" alt="Jetzt informieren!" />
          </button>
          <button id="replay" class="endcard-button" type="button">
            <img src="assets/02_endcard/fail/replay.png" alt="Nochmal spielen" />
          </button>
        </section>

        <section id="win-card" class="layer endcard" hidden>
          <img class="layer" src="assets/02_endcard/win/bubble.png" alt="" />
          <img class="layer" src="assets/02_endcard/win/konfetti.png" alt="" />
          <img class="layer" src="assets/02_endcard/win/happy.png" alt="" />
          <img
            class="layer"
            src="assets/02_endcard/win/hl.png"
            alt="Poo, tut das gut! Wenn du weißt, was dein Darm braucht."
          />
          <button id="win-cta" class="endcard-button" type="button">
            <img src="assets/02_endcard/win/cta.png" alt="Jetzt mehr erfahren" />
          </button>
        </section>
      </main>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
